# Same keys as upstream Sciget App's container_installer/neurodesk.yml (v2.2.0),
# so upstream's domain files load unchanged. cvmfsRepository and serverArgs are
# sciget-core additions.
title: Neurodesk
defaultVersion: "2026-09-23"
registry: docker.io/vnmd/neurodesktop
containerName: neurodeskapp
volumeMount: neurodesk-home
defaultStorageMount: neurodesktop-storage
description: |
  Neuroimaging tools and resources for neuroimaging research and analysis.
remoteUrl:
  - https://play.neurodesk.cloud.edu.au/
  - https://play-america.neurodesk.org/
  - https://play-europe.neurodesk.org/
cvmfsRepository: neurodesk.ardc.edu.au
serverArgs:
  - --NotebookIntelligence.github_access_token=remember
